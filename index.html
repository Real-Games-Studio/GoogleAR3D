<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>AR Senna Tower - iOS e Android</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Para evitar rolagem */
        }

        .main-image {
            width: 100vw; /* Largura da tela */
            height: 100vh; /* Altura da tela */
            object-fit: cover; /* Para garantir que a imagem cubra toda a área */
            display: block;
            margin: 0 auto;
            position: absolute;
            z-index: -1; /* Coloca a imagem atrás de outros elementos */
            cursor: pointer; /* Indica que a imagem é clicável */
        }
    </style>
</head>
<body>
    <!-- Imagem de fundo -->
    <img class="main-image"
         src="https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/page.png"
         alt="Senna Tower page" />

    <script>
        // URLs base do arquivo "Tamanho 1"
        const files = {
            tamanho1: {
                ios: 'Tamanho1.usdz',
                android: 'Tamanho1.glb'
            }
        };

        // Função para configurar o link
        function configureLinks() {
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            const link = isIOS
                ? `https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.tamanho1.ios}`
                : 'https://arvr.google.com/scene-viewer/1.0' +
                `?file=https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.tamanho1.android}` +
                '&title=SennaTower' +
                '&link=https://www.sennatower.com/' +
                '&mode=ar_only';

            // Redireciona o usuário para o link configurado
            window.location.href = link;
        }

        // Adiciona o evento de clique à imagem de fundo
        document.querySelector('.main-image').addEventListener('click', configureLinks);
    </script>
</body>
</html>
