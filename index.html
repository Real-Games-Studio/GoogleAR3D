<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>AR Senna Tower - iOS e Android</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Para evitar rolagem */
        }

        .main-image {
            width: 100vw; /* Largura da tela */
            height: 100vh; /* Altura da tela */
            object-fit: cover; /* Para garantir que a imagem cubra toda a área */
            display: block;
            margin: 0 auto;
            position: absolute;
            z-index: -1; /* Coloca a imagem atrás do botão */
        }

        .button-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .ar-button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

            .ar-button:hover {
                background-color: #0056b3;
            }
    </style>
</head>
<body>
    <!-- Imagem de fundo -->
    <img class="main-image"
         src="https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/page.png"
         alt="Senna Tower page" />

    <!-- Botão para o modelo 3D "Tamanho 1" -->
    <div class="button-container">
        <a class="ar-button" id="button-tamanho1" href="#" target="_blank">Tamanho 10x</a>
    </div>

    <script>
        // URLs base do arquivo "Tamanho 1"
        const files = {
            tamanho1: {
                ios: 'Tamanho1.usdz',
                android: 'Tamanho1.glb'
            }
        };

        // Função para configurar o link do botão
        function configureLinks() {
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            document.getElementById('button-tamanho1').href = isIOS
                ? `https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.tamanho1.ios}`
                : 'https://arvr.google.com/scene-viewer/1.0' +
                `?file=https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.tamanho1.android}` +
                '&title=SennaTower' +
                '&link=https://www.sennatower.com/' +
                '&mode=ar_only';
        }

        // Configura o link ao carregar a página
        configureLinks();
    </script>
</body>
</html>
