<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>AR Senna Tower - iOS e Android</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Para evitar rolagem */
        }

        .main-image {
            width: 100vw; /* Largura da tela */
            height: 100vh; /* Altura da tela */
            object-fit: cover; /* Para garantir que a imagem cubra toda a área */
            display: block;
            margin: 0 auto;
            cursor: pointer; /* Para indicar que é clicável */
        }
    </style>
</head>
<body>

    <!-- Link que será o botão -->
    <a id="ar-link" href="#" target="_blank">
        <img class="main-image"
             src="https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/page.png"
             alt="Senna Tower page" />
    </a>

    <script>
        // Verifica se é iOS
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        // Seleciona o link
        const linkElement = document.getElementById('ar-link');

        if (isIOS) {
            // Em iOS, apontamos diretamente para o arquivo .usdc
            linkElement.href = 'https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/SennaTowerRetopo.usdz';
        } else {
            // Em Android, usamos o Scene Viewer com o arquivo .glb
            linkElement.href = 'https://arvr.google.com/scene-viewer/1.0' +
                '?file=https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/SennaTowerRetopo.glb' +
                '&title=SennaTower' +
                '&link=https://www.sennatower.com/' +
                '&mode=ar_only';
        }
    </script>
</body>
</html>
