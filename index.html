<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>AR Senna Tower - iOS e Android</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Para evitar rolagem */
        }

        .main-image {
            width: 100vw; /* Largura da tela */
            height: 100vh; /* Altura da tela */
            object-fit: cover; /* Para garantir que a imagem cubra toda a área */
            display: block;
            margin: 0 auto;
            cursor: pointer; /* Para indicar que é clicável */
        }

        .button-container {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .ar-button {
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #007BFF;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

            .ar-button:hover {
                background-color: #0056b3;
            }
    </style>
</head>
<body>

    <!-- Link que será o botão -->
    <a id="ar-link" href="#" target="_blank">
        <img class="main-image"
             src="https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/page.png"
             alt="Senna Tower page" />
    </a>

    <!-- Botões para os arquivos -->
    <div class="button-container">
        <a class="ar-button" id="button-antigo" href="#" target="_blank">Antigo</a>
        <a class="ar-button" id="button-metade" href="#" target="_blank">Metade</a>
    </div>

    <script>
        // URLs base dos arquivos
        const files = {
            antigo: {
                ios: 'SennaTowerRAExterno_Proposta_ScaleAnimation_Timing_Antigo.usdz',
                android: 'SennaTowerRAExterno_Proposta_ScaleAnimation_Timing_Antigo.glb'
            },
            metade: {
                ios: 'SennaTowerRAExterno_Proposta_ScaleAnimation_Timing_metade.usdz',
                android: 'SennaTowerRAExterno_Proposta_ScaleAnimation_Timing_Metade.glb'
            }
        };

        // Função para configurar os links
        function configureLinks() {
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            document.getElementById('button-antigo').href = isIOS
                ? `https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.antigo.ios}`
                : 'https://arvr.google.com/scene-viewer/1.0' +
                `?file=https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.antigo.android}` +
                '&title=SennaTower' +
                '&link=https://www.sennatower.com/' +
                '&mode=ar_only';

            document.getElementById('button-metade').href = isIOS
                ? `https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.metade.ios}`
                : 'https://arvr.google.com/scene-viewer/1.0' +
                `?file=https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${files.metade.android}` +
                '&title=SennaTower' +
                '&link=https://www.sennatower.com/' +
                '&mode=ar_only';
        }

        // Configura os links ao carregar a página
        configureLinks();
    </script>
</body>
</html>
