<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>AR Senna Tower - iOS e Android</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Para evitar rolagem */
        }

        .main-image {
            width: 100vw; /* Largura da tela */
            height: 100vh; /* Altura da tela */
            object-fit: cover; /* Para garantir que a imagem cubra toda a área */
            display: block;
            margin: 0 auto;
            cursor: pointer; /* Para indicar que é clicável */
        }

        .button-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 10px;
        }

        .ar-button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <!-- Link que será o botão -->
    <a id="ar-link" href="#" target="_blank">
        <img class="main-image"
             src="https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/page.png"
             alt="Senna Tower page" />
    </a>

    <div class="button-container">
        <button class="ar-button" data-file="SennaTowerRetopo">SennaTowerRetopo</button>
        <button class="ar-button" data-file="SennaTowerRetopoBranco">SennaTowerRetopoBranco</button>
        <button class="ar-button" data-file="SennaTowerRetopo_Laranja">SennaTowerRetopoLaranja</button>
    </div>

    <script>
        // Verifica se é iOS
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        // Seleciona o link
        const linkElement = document.getElementById('ar-link');

        // Função para atualizar o link com base no arquivo selecionado
        function updateLink(file) {
            if (isIOS) {
                linkElement.href = `https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${file}.usdz`;
            } else {
                linkElement.href = 'https://arvr.google.com/scene-viewer/1.0' +
                    `?file=https://raw.githubusercontent.com/Real-Games-Studio/GoogleAR3D/main/${file}.glb` +
                    '&title=SennaTower' +
                    '&link=https://www.sennatower.com/' +
                    '&mode=ar_only';
            }
            linkElement.click(); // Simula o clique no link
        }

        // Adiciona evento de clique aos botões
        document.querySelectorAll('.ar-button').forEach(button => {
            button.addEventListener('click', () => {
                const file = button.getAttribute('data-file');
                updateLink(file);
            });
        });

        // Cancela o clique na imagem de fundo
        document.querySelector('.main-image').addEventListener('click', (event) => {
            event.preventDefault();
        });
    </script>
</body>
</html>
